<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore and study lessons on Learnova."
    >

    <meta
        name="author"
        content="Learnova"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Lessons | Learnova</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <nav aria-label="Main navigation">


        <!-- LOGO -->

        <a
            href="../index.html"
            aria-label="Learnova Home"
        >
            <strong>
                Learnova
            </strong>
        </a>


        <!-- NAVIGATION -->

        <ul>

            <li>
                <a href="../index.html">
                    Home
                </a>
            </li>


            <li>
                <a href="subjects.html">
                    Subjects
                </a>
            </li>


            <li>
                <a
                    href="lessons.html"
                    aria-current="page"
                >
                    Lessons
                </a>
            </li>


            <li>
                <a href="quiz.html">
                    Quiz
                </a>
            </li>


            <li>
                <a href="progress.html">
                    Progress
                </a>
            </li>


            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>

        </ul>


        <!-- DARK MODE -->

        <button
            type="button"
            id="theme-toggle"
            aria-label="Toggle dark mode"
            aria-pressed="false"
        >
            🌙 Dark Mode
        </button>

    </nav>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


    <section>


        <!-- PAGE HEADER -->

        <div class="section-header">

            <p>
                Learnova
            </p>


            <h1>
                Explore Lessons
            </h1>


            <p>
                Search, filter and study lessons
                at your own pace.
            </p>

        </div>



        <!-- =========================
             SEARCH + FILTER
        ========================= -->

        <div class="lesson-filters">


            <!-- SEARCH -->

            <div class="filter-group">

                <label
                    for="lesson-search-input"
                >
                    Search Lessons
                </label>


                <input
                    type="search"
                    id="lesson-search-input"
                    placeholder="Search by lesson, subject or topic..."
                    autocomplete="off"
                    aria-describedby="lesson-search-result"
                >

            </div>



            <!-- SUBJECT FILTER -->

            <div class="filter-group">

                <label
                    for="subject-filter"
                >
                    Filter by Subject
                </label>


                <select
                    id="subject-filter"
                >

                    <option value="all">
                        All Subjects
                    </option>


                    <option value="mathematics">
                        Mathematics
                    </option>


                    <option value="science">
                        Science
                    </option>


                    <option value="english">
                        English
                    </option>

                </select>

            </div>



            <!-- SEARCH RESULT -->

            <p
                id="lesson-search-result"
                aria-live="polite"
            >
                10 lessons available.
            </p>

        </div>



        <!-- =========================
             LESSON LIST
        ========================= -->

        <div
            class="lesson-list"
            aria-live="polite"
        >

            <!-- JavaScript renders lessons here -->

            <div class="error-message">
                Loading lessons...
            </div>

        </div>


    </section>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        &copy; 2026 Learnova.
        All rights reserved.
    </p>

</footer>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="../js/data.js"></script>

<script src="../js/main.js"></script>

<script src="../js/lessons.js"></script>


</body>

</html>
