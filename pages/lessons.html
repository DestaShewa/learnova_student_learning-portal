<html lang="en">

<head>
    <meta charset="UTF-8">

        content="Explore Mathematics lessons on Learnova."
    >

    <meta
        name="author"
        content="Learnova"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Lessons | Learnova</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <header>

        <nav aria-label="Main navigation">

            <a
                href="../index.html"
                aria-label="Learnova Home">
                <strong>Learnova</strong>
            </a>

            <ul>

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="subjects.html">
                        Subjects
                    </a>
                </li>

                <li>
                    <a
                        href="lessons.html"
                        aria-current="page">
                        Lessons
                    </a>
                </li>

                <li>
                    <a href="quiz.html">
                        Quiz
                    </a>
                </li>

                <li>
                    <a href="progress.html">
                        Progress
                    </a>
                </li>
                <li>
    <a href="profile.html">
        Profile
    </a>
</li>

            </ul>
            <button
    type="button"
    id="theme-toggle"
    aria-label="Toggle dark mode"
    aria-pressed="false">
    🌙 Dark Mode
</button>

        </nav>

    </header>

    <main>

     <section>

    <div class="section-header">

        <p>Learnova</p>

        <h1>
            Lessons
        </h1>

        <p>
            Search, filter and complete your lessons.
        </p>

    </div>

    <!-- LESSON FILTERS -->

    <div class="lesson-filters">

        <div class="filter-group">

            <label for="lesson-search-input">
                Search lessons
            </label>

            <input
                type="search"
                id="lesson-search-input"
                placeholder="Search by lesson title..."
                autocomplete="off"
            >

        </div>

        <div class="filter-group">

            <label for="subject-filter">
                Filter by subject
            </label>

            <select id="subject-filter">

                <option value="all">
                    All Subjects
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="Science">
                    Science
                </option>

                <option value="English">
                    English
                </option>

            </select>

        </div>

        <p
            id="lesson-search-result"
            aria-live="polite">
        </p>

    </div>

    <!-- LESSON LIST -->

    <div
        class="lesson-list"
        aria-live="polite">
    </div>

    <div>

        <a href="quiz.html">
            Take Quiz
        </a>

        <a href="progress.html">
            View Progress
        </a>

    </div>

</section>
    </main>

    <footer>

        <p>
            &copy; 2026 Learnova.
            All rights reserved.
        </p>

    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/lessons.js"></script>

</body>

</html>
