<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Test your Mathematics knowledge with Learnova quizzes."
    >

    <meta
        name="author"
        content="Learnova"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Quiz | Learnova</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <header>

        <nav aria-label="Main navigation">

            <a
                href="../index.html"
                aria-label="Learnova Home">
                <strong>Learnova</strong>
            </a>

            <ul>

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="subjects.html">
                        Subjects
                    </a>
                </li>

                <li>
                    <a href="lessons.html">
                        Lessons
                    </a>
                </li>

                <li>
                    <a
                        href="quiz.html"
                        aria-current="page">
                        Quiz
                    </a>
                </li>

                <li>
                    <a href="progress.html">
                        Progress
                    </a>
                </li>

            </ul>
            <button
    type="button"
    id="theme-toggle"
    aria-label="Toggle dark mode"
    aria-pressed="false">
    🌙 Dark Mode
</button>

        </nav>

    </header>

    <main>

        <section>

            <div class="section-header">

                <p>Mathematics</p>

                <h1>
                    Quiz
                </h1>

                <p>
                    Test your understanding
                    and see what you have learned.
                </p>

            </div>

            <form
                id="quiz-form"
                aria-live="polite">
            </form>

            <div
                id="quiz-result"
                aria-live="polite">

                <h2>
                    Result
                </h2>

                <p>
                    Answer all questions and submit
                    the quiz to see your score.
                </p>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 Learnova.
            All rights reserved.
        </p>

    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/quiz.js"></script>

</body>

</html>
